<h1>Contacto</h1>

<form>

    <label for="nombre">Nombre:</label>
    <input type="text"
           id="nombre"
           name="nombre">

    <br><br>

    <label for="email">Correo electrónico:</label>
    <input type="email"
           id="email"
           name="email">

    <br><br>

    <label for="mensaje">Mensaje:</label>

    <br>

    <textarea id="mensaje"
              name="mensaje"
              rows="5"
              cols="40"></textarea>

    <br><br>

    <button type="submit">
        Enviar
    </button>

</form>
